[project]
name = "ai-lab-pyspark-price-regression"
version = "0.1.2"
description = "Step-by-step PySpark MLlib linear regression demo: predict used-car prices, read RMSE/MAE/R2, interpret coefficients (English/Korean output)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = ["pyspark[ml]>=4.3.0,<4.4"]

[project.scripts]
price-regression = "price_regression.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_regression"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the whole CLI flow"]
